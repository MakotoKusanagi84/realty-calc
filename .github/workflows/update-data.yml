# Ежемесячное обновление данных об инфляции и ключевой ставке.
# Росстат публикует данные за прошлый месяц примерно в середине месяца, поэтому проверка
# идёт 12, 16, 20 и 24 числа: если новых данных нет, ничего не меняется.
name: Обновление данных
on:
  schedule:
    - cron: "0 6 12,16,20,24 * *"
  workflow_dispatch:          # ручной запуск кнопкой на вкладке Actions
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Обновить данные
        id: upd
        run: python tools/update_data.py
        continue-on-error: true
      - name: Сохранить изменения, если они есть
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "data-bot"
            git config user.email "data-bot@users.noreply.github.com"
            git add data
            git commit -m "Обновление данных об инфляции и ключевой ставке"
            git push
          fi
      - name: Сообщить о сбое
        if: steps.upd.outcome == 'failure'
        run: |
          echo "Обновление не прошло проверку — данные не изменены. Смотрите лог шага выше."
          exit 1
